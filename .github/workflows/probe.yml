name: probe

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Call the API with no payment header
        run: node probe.js
      - name: Commit the record
        run: |
          git config user.name  "x402-meter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "probe: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
